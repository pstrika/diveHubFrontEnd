; PHP-FPM pool override for the production App Service (P0v3: 1 vCPU, 4 GB).
; Copied by the app's startup command to /usr/local/etc/php-fpm.d/, where it
; loads after the image's own www.conf and overrides these keys of the same
; [www] pool. The image ships pm.max_children = 5, which is what let the
; 2026-10-15 session-GC stall take the whole site down: five stuck workers
; and every other request queued behind them forever.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
