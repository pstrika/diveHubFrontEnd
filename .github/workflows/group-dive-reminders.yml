name: Send group dive reminder emails

on:
  schedule:
    - cron: '0 13 * * *' # 9am Eastern (13:00 UTC / 12:00 UTC during EST)
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger groups:send-reminders
        run: |
          curl -sf "https://divers-hub.com/cron/send-group-reminders?secret=${{ secrets.CRON_SECRET }}"
