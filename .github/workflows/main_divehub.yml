# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - diveHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time per target. Azure answers 400 Bad Request when a second
# deployment starts while one is still running on the same app or slot, which
# is what happened when several pushes landed minutes apart. Later runs wait.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress --optimize-autoloader

      - name: Zip artifact for deployment
        # Azure's deploy endpoint rejects packages of 1 GB or more (400 Bad Request).
        # Leave out what the app never serves: stray chunk upload files at the public
        # root, the illustration source originals, and screenshots. Nothing is deleted
        # from the repo; the files simply do not travel in the package.
        run: zip release.zip ./* -r -x "public/assets????????-????-????-????-????????????" "public/assets/img/illustrations/originals/*" "screens/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'diveHub'
          slot-name: 'Production'
          package: .

      # The zip deploy returns before Azure has finished syncing files to
      # /home/site/wwwroot (2026-10-15: the cache rebuild below ran against
      # the previous release and pinned its config/routes - production kept
      # reporting the old version until the caches were rebuilt by hand).
      # Wait until the on-disk config/divehub.php carries this artifact's
      # version before clearing or rebuilding anything.
      - name: Wait for the deployed files to land
        run: |
          EXPECTED=$(grep -o "'version' => '[^']*'" config/divehub.php | sed "s/.*'\(.*\)'/\1/")
          echo "expecting version $EXPECTED on disk"
          TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          for i in $(seq 1 36); do
            ONDISK=$(curl -s -X POST "https://divehub.scm.azurewebsites.net/api/command" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d '{"command":"grep -o \"version. => .[0-9.]*\" config/divehub.php","dir":"site/wwwroot"}' \
              | grep -o "[0-9][0-9.]*[0-9]" | head -1)
            echo "attempt $i: on disk = ${ONDISK:-?}"
            [ "$ONDISK" = "$EXPECTED" ] && exit 0
            sleep 5
          done
          echo "deployed files did not land within 3 minutes" >&2
          exit 1

      # From here the new files are live but the OLD config/route cache is
      # still what serves requests - a page that links a route only the new
      # code defines 500s ("Route not defined") until the rebuild below.
      # So: clear and rebuild config/routes/views FIRST and fast, and leave
      # the slow application-cache sweep (a find -delete across the network
      # share, minutes at times) for last. 2026-10-15: the profile page
      # 500'd for the whole duration of that sweep.
      - name: Clear cached Laravel config and routes (config/divehub.php must be read fresh)
        continue-on-error: true
        run: |
          TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          curl -s -X POST "https://divehub.scm.azurewebsites.net/api/command" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"command":"rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/packages.php bootstrap/cache/services.php","dir":"site/wwwroot"}'

      - name: Clear stale Laravel compiled view cache
        continue-on-error: true
        run: |
          TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          curl -s -X POST "https://divehub.scm.azurewebsites.net/api/command" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"command":"find storage/framework/views -name *.php -type f -delete","dir":"site/wwwroot"}'

      # Rebuilds what the two steps above just cleared, against the code
      # that was JUST deployed - a real HTTP hit, not another Kudu command,
      # because Kudu's executor has no php binary (see
      # CronController::optimizeCache's docblock). Found 2026-10-05:
      # production had been running with ZERO config/route/view caching
      # since the clear step was added and nothing ever rebuilt it -
      # every request was re-parsing config/re-resolving routes from
      # scratch (Pablo: "the app is somewhat stalling and lagging").
      - name: Rebuild Laravel config/route/view cache for fast boot
        continue-on-error: true
        run: curl -sf "https://divers-hub.com/cron/optimize-cache?secret=${{ secrets.CRON_SECRET }}"

      # Pending migrations, over HTTP for the same no-php-in-Kudu reason.
      # Added 2026-10-15 with the sessions table (file sessions on the
      # network share took production down that day); before this,
      # nothing ever ran migrations on production.
      - name: Run pending Laravel migrations
        continue-on-error: true
        run: curl -sf "https://divers-hub.com/cron/migrate?secret=${{ secrets.CRON_SECRET }}"

      - name: Clear stale Laravel application cache (e.g. sitemap.xml)
        continue-on-error: true
        run: |
          TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          curl -s -X POST "https://divehub.scm.azurewebsites.net/api/command" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"command":"find storage/framework/cache/data -type f -delete","dir":"site/wwwroot"}'
