# Deploys the redesign branch to the "redesign" deployment slot on the
# diveHub Web App - a separate URL (divehub-redesign.azurewebsites.net)
# for testing the new frontend without touching the Production slot that
# main_divehub.yml deploys to.
#
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - diveHub (redesign slot)

on:
  push:
    branches:
      - redesign
  workflow_dispatch:

# One deploy at a time per target. Azure answers 400 Bad Request when a second
# deployment starts while one is still running on the same app or slot, which
# is what happened when several pushes landed minutes apart. Later runs wait.
concurrency:
  group: deploy-redesign-slot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress

      - name: Zip artifact for deployment
        # Azure's deploy endpoint rejects packages of 1 GB or more (400 Bad Request).
        # Leave out what the app never serves: stray chunk upload files at the public
        # root, the illustration source originals, and screenshots. Nothing is deleted
        # from the repo; the files simply do not travel in the package.
        run: zip release.zip ./* -r -x "public/assets????????-????-????-????-????????????" "public/assets/img/illustrations/originals/*" "screens/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app-redesign
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'redesign'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app-redesign

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'diveHub'
          slot-name: 'redesign'
          package: .

      - name: Clear stale Laravel compiled view cache
        continue-on-error: true
        run: |
          TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          curl -s -X POST "https://divehub-redesign.scm.azurewebsites.net/api/command" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"command":"find storage/framework/views -name *.php -type f -delete","dir":"site/wwwroot"}'

      - name: Clear stale Laravel application cache (e.g. sitemap.xml)
        continue-on-error: true
        run: |
          TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          curl -s -X POST "https://divehub-redesign.scm.azurewebsites.net/api/command" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"command":"find storage/framework/cache/data -type f -delete","dir":"site/wwwroot"}'

      - name: Clear cached Laravel config and routes (config/divehub.php must be read fresh)
        continue-on-error: true
        run: |
          TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          curl -s -X POST "https://divehub-redesign.scm.azurewebsites.net/api/command" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"command":"rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/packages.php bootstrap/cache/services.php","dir":"site/wwwroot"}'
