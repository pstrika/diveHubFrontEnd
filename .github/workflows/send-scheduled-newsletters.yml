name: Send scheduled newsletters

# The schedule trigger was retired 2026-09-22 (Pablo: "we need to change the
# dependency on Github for the cron") - GitHub Actions only fired this twice
# in 17 hours despite the every-15-minutes cron, a known unreliability with
# high-frequency `schedule` triggers, and it silently missed a real
# scheduled newsletter send. An Azure Logic App
# (divehub-send-scheduled-newsletters, resource group DiveHub) now hits the
# same endpoint on the same 15-minute recurrence instead. workflow_dispatch
# stays for a manual "run now" from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  send-scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger newsletter:send-scheduled
        run: |
          curl -sf "https://divehub-redesign.azurewebsites.net/cron/send-scheduled-newsletters?secret=${{ secrets.CRON_SECRET }}"
