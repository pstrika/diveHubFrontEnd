name: Send group activity digest emails

# The schedule trigger was retired 2026-09-22 (Pablo: "we need to change the
# dependency on Github for the cron") - it also never actually fired from
# here in the first place, since GitHub only evaluates `schedule` triggers
# on a repo's default branch (main), not redesign. An Azure Logic App
# (divehub-group-activity-digest, resource group DiveHub) now hits the same
# endpoint Sun/Wed/Fri at 9am Eastern instead. workflow_dispatch stays for a
# manual "run now" from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger groups:send-activity-digest
        run: |
          curl -sf "https://divers-hub.com/cron/send-group-activity-digest?secret=${{ secrets.CRON_SECRET }}"
