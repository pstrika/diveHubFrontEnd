<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline - Divers Hub</title>
<style>
  /* Inline on purpose - cached at service-worker install time, before
     this user has ever loaded a page online, so it can't depend on
     divershub.css having been cached yet (Pablo, 2026-10-05). */
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b2a3a; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .wrap { max-width: 360px; }
  img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 18px; }
  h1 { font-size: 1.3rem; margin: 0 0 10px; }
  p { font-size: .92rem; color: rgba(255,255,255,.75); margin: 0 0 22px; line-height: 1.5; }
  button { background: #5fb4cf; color: #0b2a3a; border: none; border-radius: 999px; padding: 11px 24px; font-weight: 700; font-size: .92rem; cursor: pointer; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/img/pwa/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Divers Hub can't reach the network right now. Pages you've already visited may still be available - try going back, or reconnect and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
